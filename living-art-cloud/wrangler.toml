name = "living-art-cloud"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Restrict this in production to the real site origin(s), e.g.
#   ALLOWED_ORIGIN = "https://emvycheck.com"
# "*" is fine for local development and initial testing only.
[vars]
ALLOWED_ORIGIN = "*"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LivingArtRoom"

[[migrations]]
tag = "v1"
new_classes = ["LivingArtRoom"]
